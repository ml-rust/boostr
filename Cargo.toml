[package]
name = "boostr"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "ML framework built on numr - attention, quantization, model architectures"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/boostr"
documentation = "https://docs.rs/boostr"
keywords = [
  "machine-learning",
  "deep-learning",
  "transformer",
  "inference",
  "quantization",
]
categories = ["science", "mathematics"]

[dependencies]
numr = "0.6"
# Matches splintr's hasher: `Tokenizer::with_merge_ranks` takes an FxHashMap.
rustc-hash = "2.0"
half = { version = "2", features = ["bytemuck"] }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0"

# Optional: CUDA backend
cudarc = { version = "0.19", optional = true, features = [
  "cuda-version-from-build-system",
] }

# Optional: WebGPU backend
wgpu = { version = "29.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }

# Optional: Distributed inference (nexar transport)
nexar = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
tracing = "0.1"

rayon = "1.12"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
# Compressed-audio decode (FLAC/MP3/OGG-Vorbis/WAV) for the audio corpus loaders.
# Gated behind `audio`: a text-only build has no use for four codec decoders.
symphonia = { version = "0.5", optional = true, default-features = false, features = [
  "flac",
  "mp3",
  "ogg",
  "vorbis",
  "pcm",
  "wav",
] }
memmap2 = "0.9"
splintr = { version = "0.19", features = ["vocab-whisper"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

# Optional: TTS grapheme-to-phoneme via espeak-ng (system dep: espeak-ng-dev)
espeakng = { version = "0.2", optional = true }

[dev-dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
# Tests tokenize with cl100k_base. Declaring it here rather than on the main
# dependency keeps the ~3 MB payload out of every downstream build: dev-dependency
# features unify only when building boostr's own tests.
splintr = { version = "0.19", features = ["vocab-cl100k"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rustls = "0.23"

[features]
default = ["cpu"]

# Speech and audio: `model::audio` in full — corpus preparation (VAD, Whisper,
# NeuCodec), the enhancement chain, TTS models, and the compressed-audio
# decoders. Off by default; a text-only training or serving build pays nothing
# for it.
#
# `model::speech_lm` is NOT gated. It is token packing and layout — no audio
# processing, no extra dependency — and the dependency runs one way:
# `model::audio` uses `speech_lm`, never the reverse.
audio = ["dep:symphonia"]

# TTS grapheme-to-phoneme (requires libespeak-ng at runtime). Implies `audio`:
# phonemes exist to be spoken, and every consumer of this feature is in the
# audio path already.
tts-g2p = ["audio", "dep:espeakng"]

# Backend features (passed through to numr)
cpu = []
cuda = ["numr/cuda", "dep:cudarc"]
nccl = ["numr/nccl"]
wgpu = ["numr/wgpu", "dep:wgpu", "dep:bytemuck"]

# Distributed inference
#
# Pulls in `f16` because the disaggregated KV cache wire format carries bf16 — the
# training dtype — and reconstructing a bf16 cache goes through numr's f16-gated
# kernels. Without it a bf16 transfer would fail at run time inside a server.
distributed = ["dep:nexar", "dep:anyhow", "dep:bytemuck", "f16"]

# Precision features
f16 = ["numr/f16"]
fp8 = ["numr/fp8"]

# Bundled tokenizer vocabularies, one feature per splintr family, forwarded
# verbatim so a consumer never needs a direct splintr dependency just to reach
# a feature flag.
#
# None are on by default: splintr gates the vocabulary DATA behind these, and a
# family costs 2.6-6.4 MB (all of them, ~42 MB). A consumer loading a
# checkpoint's own `tokenizer.json` should pay for none of it.
#
# `vocab-whisper` is NOT here — it is a hard dependency of
# `WhisperBundle::from_dir`, which loads the bundled multilingual Whisper
# vocabulary rather than the checkpoint's `tokenizer.json`, so it stays enabled
# unconditionally on the splintr dependency itself.
vocab-cl100k = ["splintr/vocab-cl100k"]
vocab-o200k = ["splintr/vocab-o200k"]
vocab-gpt-oss = ["splintr/vocab-gpt-oss"]
vocab-phi4 = ["splintr/vocab-phi4"]
vocab-olmo2 = ["splintr/vocab-olmo2"]
vocab-llama3 = ["splintr/vocab-llama3"]
vocab-llama2 = ["splintr/vocab-llama2"]
vocab-deepseek = ["splintr/vocab-deepseek"]
vocab-qwen = ["splintr/vocab-qwen"]
vocab-glm = ["splintr/vocab-glm"]
vocab-gemma2 = ["splintr/vocab-gemma2"]
vocab-gemma3 = ["splintr/vocab-gemma3"]
vocab-gemma4 = ["splintr/vocab-gemma4"]
vocab-kimi = ["splintr/vocab-kimi"]
vocab-mistral = ["splintr/vocab-mistral"]
vocab-modernbert = ["splintr/vocab-modernbert"]
# Every bundled vocabulary at once.
vocabs = ["splintr/vocabs"]

[package.metadata.docs.rs]
no-default-features = true

# Targets that need `model::audio`. Without these entries a default
# `cargo check --all-targets` tries to build them against a boostr that has
# no audio module and fails on the import rather than skipping the target.
