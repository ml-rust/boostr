[package]
name = "boostr-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Sample-level audio DSP, file codecs, voices, and pipelines for boostr"
license = "Apache-2.0"

[lib]
bench = false

[dependencies]
boostr = { path = "../..", features = ["audio"] }
# The denoiser runs its STFT through numr's CPU client.
numr = "0.7"
thiserror = "2"
tracing = "0.1"
# `whisper` reads `generation_config.json`; the VoxCPM2 examples read eval
# manifests and write reports. boostr already links both, so nothing new
# enters the graph.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `corpus` and `voxcpm` load `tokenizer.json` files through splintr.
splintr = { version = "0.20", features = ["vocab-whisper"] }

# Compressed-audio decode (FLAC/MP3/OGG-Vorbis/WAV). Off by default: a
# WAV-only consumer has no use for four codec decoders.
symphonia = { version = "0.5", optional = true, default-features = false, features = [
  "flac",
  "mp3",
  "ogg",
  "vorbis",
  "pcm",
  "wav",
] }

# misaki English G2P: the embedded lexicons are zlib streams, and the port
# needs NFKC and Unicode general categories. boostr's `zip` already links
# flate2 and splintr links both unicode crates, so nothing new enters the
# graph.
flate2 = { version = "1", optional = true }
unicode-normalization = { version = "0.1", optional = true }
unicode-general-category = { version = "1", optional = true }
# spaCy tokenizer: its prefix, suffix, infix and URL patterns use lookbehind
# and lookahead. splintr already links regexr, so nothing new enters the
# graph.
regexr = { version = "0.5", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
# `voxcpm_sensitivity` reinterprets raw weight bytes per quant format.
bytemuck = { version = "1.25", features = ["derive"] }
# Tests tokenize with cl100k_base. A dev-dependency feature unifies only when
# building this crate's own tests, so downstream builds pay nothing.
splintr = { version = "0.20", features = ["vocab-cl100k"] }

[features]
default = []

# Compressed containers beyond RIFF/WAVE.
decode = ["dep:symphonia"]
# misaki English G2P from raw text or pre-tagged tokens, with the US and GB
# lexicons embedded. No system dependencies. Implies `spacy-tagger` (and so
# `spacy-tokenizer`), the tokenizer and tagger misaki's pipeline reads its
# tokens from. Implies `f16`: the out-of-vocabulary model in `g2p::neural`
# stores its weights as bf16.
misaki = [
  "dep:flate2",
  "dep:unicode-normalization",
  "dep:unicode-general-category",
  "spacy-tagger",
  "f16",
]
# The spaCy `en_core_web_sm` 3.8.0 tokenizer with its patterns, special cases
# and norm tables embedded. Separate from `misaki` so a consumer that needs
# spaCy tokens and lexical attributes does not embed the misaki lexicons.
spacy-tokenizer = ["dep:regexr", "dep:unicode-general-category"]
# The spaCy `en_core_web_sm` 3.8.0 `tok2vec` + `tagger` (Penn Treebank tags),
# the network from boostr, the attribute IDs here. Weights load at run time
# from a directory (`EnglishTagger::from_dir`, written by
# `assets/spacy_en/convert_tagger.py`); none are compiled in. Implies
# `spacy-tokenizer`, whose tokens it tags.
spacy-tagger = ["boostr/spacy-tagger", "spacy-tokenizer"]
# Narration scripts: phrases, VoxCPM2 chunks, subtitle and timed script
# files, written-script alignment, and number words. Its sentence pattern
# uses lookahead, and number words are read after NFKD. splintr already
# links both crates, so nothing new enters the graph.
narration = ["dep:regexr", "dep:unicode-normalization"]
# `TtsEngine`, `TtsBundle`, `Voice`: the engine-agnostic synthesis surface.
tts = []
# Kokoro synthesis pipeline: model from boostr, voice packs and the engine
# here. Implies `misaki`: Kokoro's English G2P is the misaki port, US for
# `a*` voices and GB for `b*`, no system dependency.
kokoro = ["boostr/kokoro", "tts", "misaki"]
# VoxCPM2 voice cloning: model from boostr, reference decode and tokenizer here.
voxcpm = ["boostr/voxcpm", "tts", "decode"]
# Whisper transcription: the weights from boostr, the tokenizer, generation
# config and one-call `transcribe` here. Does NOT imply `vad`;
# `WhisperBundle::transcribe_segments` needs both.
whisper = ["boostr/whisper", "decode"]
# VITS (MMS-TTS) synthesis: the model from boostr, the character tokenizer
# here. Refuses at load any checkpoint needing phonemization or uroman
# romanization (`VitsTokenizer::from_dir`).
vits = ["boostr/vits", "tts"]
# Silero VAD segmentation: the network from boostr, the `get_speech_timestamps`
# port here.
vad = ["boostr/silero-vad"]
# NeuCodec probing examples.
neucodec = ["boostr/neucodec"]
# Speech-corpus preparation: VAD, Whisper, NeuCodec, enhancement.
corpus = ["whisper", "vad", "boostr/neucodec", "decode"]
# Backend pass-through for the examples that pick a device at run time.
cuda = ["boostr/cuda"]
f16 = ["boostr/f16"]

# Fixture-gated integration tests that need a model gate. Without these
# entries a featureless `cargo check --all-targets` fails on the import
# rather than skipping the target.
[[test]]
name = "whisper_integration"
required-features = ["whisper", "vad"]

[[test]]
name = "whisper_word_oracle"
required-features = ["whisper"]

[[test]]
name = "silero_vad_segment_parity"
required-features = ["vad"]

[[test]]
name = "voxcpm_stream_parity"
required-features = ["voxcpm"]

[[test]]
name = "voxcpm_batch_cuda"
required-features = ["voxcpm", "cuda"]

[[test]]
name = "misaki_g2p_oracle"
required-features = ["misaki"]

[[test]]
name = "kokoro_pipeline_oracle"
required-features = ["kokoro"]

[[test]]
name = "spacy_tokenizer_oracle"
required-features = ["spacy-tokenizer"]

[[test]]
name = "spacy_tagger_oracle"
required-features = ["spacy-tagger"]

[[test]]
name = "vits_tokenizer_oracle"
required-features = ["vits"]

[[test]]
name = "vits_engine_integration"
required-features = ["vits"]

[[test]]
name = "g2p_neural_gold"
required-features = ["misaki"]

[[test]]
name = "narration_oracle"
required-features = ["narration"]

